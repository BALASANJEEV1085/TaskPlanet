name: Build, Deploy, and Verify TaskPlanet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  INSTANCE_ID: i-0c19c471d723559c7
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'AWS_CREDS'
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_CREDS
          cat > ~/.aws/config << 'AWS_CONFIG'
          [default]
          region = ${{ env.REGION }}
          AWS_CONFIG
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build, Tag, and Push Docker Image
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
          docker build -t $FULL_IMAGE:${{ env.IMAGE_TAG }} -t $FULL_IMAGE:latest -f Dockerfile .
          docker push $FULL_IMAGE:${{ env.IMAGE_TAG }}
          docker push $FULL_IMAGE:latest

      - name: Deploy to EC2 via SSM
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $FULL_IMAGE:latest"
            ]
          }
          SSMPARAMS
          sed -i "s|\$REGION|${{ env.REGION }}|g; s|\$ECR_REGISTRY|${{ env.ECR_REGISTRY }}|g; s|\$FULL_IMAGE|$FULL_IMAGE|g" /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command --instance-ids "${{ env.INSTANCE_ID }}" --region "${{ env.REGION }}" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          while true; do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --instance-id "${{ env.INSTANCE_ID }}" --region "${{ env.REGION }}" --query "CommandInvocations[0].Status" --output text)
            echo "Command status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed"
              exit 1
            fi
            sleep 5
          done

      - name: Health Check
        run: |
          echo "Waiting for application to become healthy..."
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://35.154.76.18 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed: HTTP 200"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE - retrying in 5 seconds..."
            sleep 5
          done
          echo "Health check failed after 30 attempts"
          exit 1