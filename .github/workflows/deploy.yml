name: Build and Deploy TaskPlanet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  INSTANCE_ID: i-0e9eb5125d7a6be91
  REGION: ap-south-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            -t app:latest \
            -f Dockerfile \
            .

      - name: Save image as tar for inspection
        run: docker save app:latest -o /tmp/app-image.tar

      - name: Extract build outputs for diagnostics
        run: |
          mkdir -p /tmp/extracted
          tar -xf /tmp/app-image.tar -C /tmp/extracted
          docker run --rm app:latest sh -c "ls -la /usr/share/nginx/html/ && echo '---BACKEND---' && ls -la /usr/src/app/" > /tmp/build-diagnostics.txt
          cat /tmp/build-diagnostics.txt

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Tag and push image to ECR
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker tag app:latest $IMAGE_URI
          docker push $IMAGE_URI
          echo "Pushed image: $IMAGE_URI"

      - name: Deploy to EC2 via SSM
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text

      - name: Wait for deployment to settle
        run: sleep 15

      - name: Health check
        run: |
          echo "Checking application health at http://13.206.49.26"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 http://13.206.49.26)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Application is healthy (HTTP 200)"