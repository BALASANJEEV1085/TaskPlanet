name: Build, Push, and Deploy to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  IMAGE_TAG: ${{ github.sha }}
  INSTANCE_ID: i-0c56eb2e4cbe15fca

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region $REGION

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 via SSM
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/taskplanet:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 5000:5000 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/taskplanet:latest"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)
            
            if [ "$STATUS" == "Success" ]; then
              echo "Deployment command completed successfully"
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "Deployment command failed with status: $STATUS"
              # Get error output
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            echo "Waiting for deployment... attempt $i"
            sleep 10
          done

      - name: Health check
        run: |
          sleep 15
          for i in {1..12}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://65.0.253.152:5000/api/health || echo "000")
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "Health check passed - HTTP 200"
              exit 0
            fi
            echo "Waiting for service to be healthy... attempt $i (HTTP $HTTP_STATUS)"
            sleep 10
          done
          echo "Health check failed after multiple attempts"
          exit 1