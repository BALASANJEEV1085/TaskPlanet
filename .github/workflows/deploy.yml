name: Deploy to EC2 via ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  INSTANCE_ID: i-0e9eb5125d7a6be91
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "region=${{ env.REGION }}" >> ~/.aws/config

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -f ${{ github.workspace }}/Dockerfile \
            ${{ github.workspace }}

      - name: Tag and push Docker image
        run: |
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Build diagnostics
        run: |
          echo "=== Build Information ==="
          echo "ECR Registry: ${{ env.ECR_REGISTRY }}"
          echo "Repository: ${{ env.ECR_REPOSITORY }}"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo "Instance ID: ${{ env.INSTANCE_ID }}"
          echo "Region: ${{ env.REGION }}"

      - name: Deploy to EC2 via SSM
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region "${{ env.REGION }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait for command completion
          sleep 30

          # Check command status
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --details \
            --region "${{ env.REGION }}"

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 15

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 \
            http://13.206.49.26/ || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ Health check passed - Application is running (HTTP 200)"
          else
            echo "✗ Health check failed - HTTP status: $HTTP_STATUS"
            echo "Attempting additional wait..."
            sleep 30
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 \
              http://13.206.49.26/ || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✓ Health check passed after retry - Application is running (HTTP 200)"
            else
              echo "✗ Health check failed after retry - HTTP status: $HTTP_STATUS"
              exit 1
            fi
          fi