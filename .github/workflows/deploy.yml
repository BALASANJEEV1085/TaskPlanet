name: Deploy TaskPlanet to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  INSTANCE_ID: i-0c56eb2e4cbe15fca
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and tag Docker image
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${SHORT_SHA}"
          docker build -t app -f Dockerfile .
          docker tag app $FULL_IMAGE
          docker tag app $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.sha.outputs.short_sha }}"

      - name: Pull secrets from AWS Secrets Manager
        id: secrets
        run: |
          SECRETS=$(aws secretsmanager get-secret-value --secret-id deptic/TaskPlanet/secrets --region $AWS_REGION --query SecretString --output text)
          echo "$SECRETS" > /tmp/app-secrets.env
          echo "Secrets pulled successfully to /tmp/app-secrets.env"

      - name: Deploy to EC2 via SSM
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $ECR_REGISTRY/$ECR_REPOSITORY:latest"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY" \
            --query "Command.CommandId" \
            --output text)
          echo "ECR login command ID: $COMMAND_ID"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --query "Command.CommandId" \
            --output text)
          echo "Pull command ID: $COMMAND_ID"
          
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=docker stop app || true" \
            --query "Command.CommandId" \
            --output text
          
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=docker rm app || true" \
            --query "Command.CommandId" \
            --output text
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=docker run -d --restart always -p 80:80 --name app $ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --query "Command.CommandId" \
            --output text)
          echo "Container start command ID: $COMMAND_ID"

      - name: Wait for container startup
        run: sleep 15

      - name: Health check
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://65.0.253.152 || echo "000")
          echo "HTTP response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 301 ] && [ "$HTTP_CODE" -ne 302 ]; then
            echo "Health check failed with HTTP code $HTTP_CODE"
            exit 1
          fi
          echo "Health check passed!"

      - name: Deployment success notification
        run: echo "TaskPlanet deployed successfully to http://65.0.253.152"