name: Deploy TaskPlanet to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  INSTANCE_ID: i-0c56eb2e4cbe15fca
  PUBLIC_URL: http://65.0.253.152
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build diagnostics - Node version
        run: |
          node --version
          npm --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS CLI
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet awscli

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "${{ env.AWS_REGION }}"

      - name: Login to Amazon ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | \
          docker login --username AWS --password-stdin "${{ env.ECR_REGISTRY }}"

      - name: Build and push Docker image
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Build and push
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker build -t $IMAGE_URI -f Dockerfile .
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Pull secrets from AWS Secrets Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          SECRETS=$(aws secretsmanager get-secret-value --secret-id deptic/TaskPlanet/secrets --region "${{ env.AWS_REGION }}" --query SecretString --output text)
          echo "$SECRETS" > /tmp/secrets.json
          echo "Secrets fetched successfully"

      - name: Send SSM command to deploy on EC2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          REGION="${{ env.AWS_REGION }}"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
          ECR_REPOSITORY="${{ env.ECR_REPOSITORY }}"
          IMAGE_TAG="${{ env.IMAGE_TAG }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $FULL_IMAGE"
            ]
          }
          SSMPARAMS

          sed -i "s|\\\$REGION|$REGION|g; s|\\\$ECR_REGISTRY|$ECR_REGISTRY|g; s|\\\$FULL_IMAGE|$FULL_IMAGE|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          for i in $(seq 1 12); do
            sleep 10
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "CommandInvocations[0].Status" \
              --output text)
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              # Get error output
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text
              exit 1
            fi
            echo "Waiting for deployment... attempt $i"
          done

      - name: Health Check
        run: |
          echo "Checking health at ${{ env.PUBLIC_URL }}"
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.PUBLIC_URL }}" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed - HTTP 200"
              exit 0
            fi
            echo "Waiting for service... attempt $i (HTTP $HTTP_CODE)"
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          curl -v "${{ env.PUBLIC_URL }}" 2>&1 || true
          exit 1