name: Build and Deploy to EC2 via Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  INSTANCE_ID: i-0c56eb2e4cbe15fca

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "$FULL_IMAGE" \
            -f Dockerfile \
            .
          echo "Image built: $FULL_IMAGE"

      - name: Save image for diagnostic
        run: |
          docker images --filter reference="$ECR_REGISTRY/$ECR_REPOSITORY"

      - name: Install AWS CLI
        run: |
          pip install awscli --quiet

      - name: Push image to ECR
        run: |
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$FULL_IMAGE"
          echo "Image pushed: $FULL_IMAGE"

      - name: Pull and deploy on EC2 via SSM
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          sed -i "s|\$REGION|$REGION|g; s|\$ECR_REGISTRY|$ECR_REGISTRY|g; s|\$IMAGE_URI|$FULL_IMAGE|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent: $COMMAND_ID"
          echo "Waiting for command to finish..."

          sleep 15

          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "CommandInvocations[0].Status" \
            --output text)

          echo "Deployment status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed. Fetching output..."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "StandardOutputContent" \
              --output text
            exit 1
          fi

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 10

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 http://65.0.253.152 || echo "000")
          echo "HTTP status code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check FAILED (expected 200, got $HTTP_CODE)"
            curl -s --connect-timeout 10 --max-time 30 http://65.0.253.152 || true
            exit 1
          fi

          echo "Health check PASSED"