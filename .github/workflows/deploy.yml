name: Build and Deploy TaskPlanet to EC2/Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  INSTANCE_ID: i-0c56eb2e4cbe15fca
  DOCKERFILE_PATH: .

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f ${{ env.DOCKERFILE_PATH }}/Dockerfile .

      - name: Tag image with commit SHA
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Install AWS CLI
        run: |
          curl -sL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install

      - name: Deploy to EC2 via SSM
        run: |
          # Login to ECR and deploy using SSM Run Command
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          # Write SSM parameters to file (avoids shell parsing issues)
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e PORT=5000 $IMAGE_URI"
            ],
            "workingDirectory": ["/"],
            "executionTimeout": ["600"]
          }
          SSMPARAMS

          # Handle ECR_REGISTRY and IMAGE_URI environment variables for SSM
          sed -i "s|\$REGION|${{ env.AWS_REGION }}|g" /tmp/ssm-params.json
          sed -i "s|\$ECR_REGISTRY|${{ env.ECR_REGISTRY }}|g" /tmp/ssm-params.json
          sed -i "s|\$IMAGE_URI|$FULL_IMAGE|g" /tmp/ssm-params.json

          # Send SSM command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region "${{ env.AWS_REGION }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

          # Wait for command to complete
          sleep 30

      - name: Verify deployment health
        run: |
          echo "Checking application health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 http://65.0.253.152/api/auth/login || echo "failed")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "400" ] || [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "405" ]; then
            echo "Application is responding (expected status for API endpoint)"
          elif [ "$HTTP_STATUS" = "failed" ]; then
            echo "ERROR: Application health check failed"
            exit 1
          else
            echo "Application is responding with status $HTTP_STATUS"
          fi