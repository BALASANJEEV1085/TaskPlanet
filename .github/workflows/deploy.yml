name: Deploy TaskPlanet to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  INSTANCE_ID: i-0c56eb2e4cbe15fca
  CONTAINER_PORT: 80

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Authenticate Docker to ECR
        run: |
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build and tag Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -f Dockerfile -t $FULL_IMAGE .
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

      - name: Push image to ECR
        run: |
          docker push "$FULL_IMAGE"

      - name: Retrieve secrets from AWS Secrets Manager
        run: |
          SECRETS=$(aws secretsmanager get-secret-value --secret-id deptic/TaskPlanet/secrets --region $AWS_DEFAULT_REGION --query SecretString --output text)
          echo "$SECRETS" | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > /tmp/.env.backend

      - name: Pull latest image and deploy on EC2 via SSM
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $FULL_IMAGE"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_DEFAULT_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

      - name: Health check
        run: |
          sleep 15
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://65.0.253.152 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed - HTTP 200"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE - retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1