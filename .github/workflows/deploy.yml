name: Build, Deploy, and Verify TaskPlanet

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: taskplanet
  INSTANCE_ID: i-0e9eb5125d7a6be91
  SECRETS_ID: deptic/TaskPlanet/secrets

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set default.region $REGION

      - name: Build Docker image
        run: |
          docker build -t taskplanet:latest .

      - name: Tag and push Docker image to ECR
        run: |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          IMAGE_TAG="${{ github.sha }}"
          docker tag taskplanet:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag taskplanet:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Fetch environment secrets from AWS Secrets Manager
        run: |
          SECRETS_JSON=$(aws secretsmanager get-secret-value --secret-id $SECRETS_ID --region $REGION --query SecretString --output text)
          echo "$SECRETS_JSON" > /tmp/env-secrets.json
          echo "Secrets fetched successfully"

      - name: Deploy via SSM to EC2 instance
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $FULL_IMAGE",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $FULL_IMAGE"
            ]
          }
          SSMPARAMS
          sed -i "s|\$REGION|$REGION|g; s|\$ECR_REGISTRY|$ECR_REGISTRY|g; s|\$FULL_IMAGE|$FULL_IMAGE|g" /tmp/ssm-params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"
          sleep 10
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION"

      - name: Health check
        run: |
          sleep 15
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 http://13.206.49.26/api/posts || echo "000")
          if [ "$HTTP_CODE" = "000" ]; then
            echo "Health check failed - service not responding"
            exit 1
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed - HTTP 200"
          else
            echo "Health check returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi